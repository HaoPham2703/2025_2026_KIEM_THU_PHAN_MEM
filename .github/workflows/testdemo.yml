name: Test & Build

on:
  push:
    branches: [main, master, develop, webdemo, weblau]
  pull_request:
    branches: [main, master, develop, webdemo, weblau]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"
          cache-dependency-path: Back-end/package-lock.json

      - name: Install dependencies
        working-directory: ./Back-end
        run: npm install
        continue-on-error: false

      - name: Run tests
        working-directory: ./Back-end
        run: npm test -- --json --outputFile=test-results.json || true
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          JWT_EXPIRES_IN: 90d
          JWT_COOKIE_EXPIRES_IN: 90
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: 587
          EMAIL_USERNAME: test@example.com
          EMAIL_PASSWORD: testpassword
          EMAIL_FROM: test@example.com

      - name: Generate test coverage
        working-directory: ./Back-end
        run: npm run test:coverage
        continue-on-error: true

      - name: Test Summary
        if: always()
        working-directory: ./Back-end
        run: |
          echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse test results if available
          if [ -f test-results.json ]; then
            echo "### ✅ Test Statistics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            NUM_TESTS=$(node -p "require('./test-results.json').numTotalTests || 'N/A'")
            NUM_PASSED=$(node -p "require('./test-results.json').numPassedTests || 'N/A'")
            NUM_FAILED=$(node -p "require('./test-results.json').numFailedTests || 'N/A'")
            echo "| Total Tests | $NUM_TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $NUM_PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $NUM_FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Show failed tests if any
            if [ "$NUM_FAILED" != "0" ] && [ "$NUM_FAILED" != "N/A" ]; then
              echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Xem chi tiết log:** Click vào step 'Run tests' ở trên để xem log đầy đủ" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Các test failed:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              # Extract failed test names
              node -e "
                const results = require('./test-results.json');
                if (results.testResults && results.testResults.length > 0) {
                  results.testResults.forEach(suite => {
                    if (suite.assertionResults) {
                      suite.assertionResults.forEach(test => {
                        if (test.status === 'failed') {
                          console.log('- ' + test.fullName);
                          if (test.failureMessages && test.failureMessages.length > 0) {
                            const firstError = test.failureMessages[0].split('\\n')[0];
                            console.log('  - Error: ' + firstError.substring(0, 100));
                          }
                        }
                      });
                    }
                  });
                }
              " >> $GITHUB_STEP_SUMMARY || echo "Không thể parse failed tests. Xem log ở trên." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### ⚠️ Test Results" >> $GITHUB_STEP_SUMMARY
            echo "Test results file not found. Check test output above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Cách xem log chi tiết:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Click vào step 'Run tests' ở trên" >> $GITHUB_STEP_SUMMARY
            echo "2. Scroll xuống để xem toàn bộ test output" >> $GITHUB_STEP_SUMMARY
            echo "3. Tìm các dòng có 'FAIL' hoặc '●' để xem test nào fail" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Parse coverage if available
          if [ -f coverage/coverage-summary.json ]; then
            echo "### 📈 Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Type | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|------|----------|" >> $GITHUB_STEP_SUMMARY
            STATEMENTS=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct || 'N/A'")
            BRANCHES=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct || 'N/A'")
            FUNCTIONS=$(node -p "require('./coverage/coverage-summary.json').total.functions.pct || 'N/A'")
            LINES=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct || 'N/A'")
            echo "| Statements | $STATEMENTS% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | $BRANCHES% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | $FUNCTIONS% |" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | $LINES% |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Test results JSON: Available in artifacts (download để xem chi tiết)" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage report: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📖 Hướng dẫn xem log chi tiết" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Xem log trên GitHub:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Click vào step 'Run tests' ở trên" >> $GITHUB_STEP_SUMMARY
          echo "   - Scroll xuống để xem toàn bộ output" >> $GITHUB_STEP_SUMMARY
          echo "   - Tìm các dòng có 'FAIL' hoặc '●' để xem test nào fail" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Tải test results:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Vào phần 'Artifacts' ở cuối trang" >> $GITHUB_STEP_SUMMARY
          echo "   - Download 'test-results' để xem file JSON chi tiết" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. **Xem coverage:**" >> $GITHUB_STEP_SUMMARY
          echo "   - Download 'backend-coverage' artifact" >> $GITHUB_STEP_SUMMARY
          echo "   - Mở file `index.html` trong thư mục coverage để xem báo cáo" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Back-end/test-results.json
          retention-days: 7
        continue-on-error: true

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: Back-end/coverage
          retention-days: 7
        continue-on-error: true

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    # Build sẽ chạy ngay cả khi test fail
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install dependencies
        working-directory: ./FrontEnd
        run: npm install
        continue-on-error: false

      - name: Build frontend
        working-directory: ./FrontEnd
        run: npm run build
        continue-on-error: true
        timeout-minutes: 10

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: FrontEnd/dist
          retention-days: 1
