name: Module3 - Product Test

on:
  push:
    branches: [weblau]
  pull_request:
    branches: [weblau]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        mongodb-version: ["6.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Install dependencies
        working-directory: ./Back-end
        run: npm install

      - name: Run Module3 Tests
        working-directory: ./Back-end
        env:
          DATABASE: mongodb://localhost:27017/hcshop-test
          JWT_SECRET: test-secret-key-for-module3-product
          JWT_EXPIRES_IN: 90d
          JWT_COOKIE_EXPIRES_IN: 90
        run: |
          echo "🧪 Running Module3 - Product Management Tests..."
          npx jest tests/unit/controllers/productController.test.js --coverage --json --outputFile=test-results.json || true

      - name: Generate Test Report
        if: always()
        working-directory: ./Back-end
        run: |
          if [ -f test-results.json ]; then
            echo "📊 Generating test report..."
            
            TOTAL_TESTS=$(jq '.numTotalTests' test-results.json)
            PASSED_TESTS=$(jq '.numPassedTests' test-results.json)
            FAILED_TESTS=$(jq '.numFailedTests' test-results.json)
            
            echo "## 🛍️ Module3 - Product Management Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** \`${GITHUB_REF#refs/heads/}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Module:** Module3 - Product Management" >> $GITHUB_STEP_SUMMARY
            echo "**Test File:** productController.test.js" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### 📈 Test Statistics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| 📝 Total Tests | $TOTAL_TESTS | - |" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED_TESTS | - |" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILED_TESTS" -gt 0 ]; then
              echo "| ❌ Failed | $FAILED_TESTS | ⚠️ Needs attention |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ❌ Failed | $FAILED_TESTS | - |" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🎯 Test Coverage by Function" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Function | Test Cases | Description |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-----------|-------------|" >> $GITHUB_STEP_SUMMARY
            echo "| Get All Products | 6 tests | Xem danh sách sản phẩm |" >> $GITHUB_STEP_SUMMARY
            echo "| Get Product | 3 tests | Xem chi tiết sản phẩm |" >> $GITHUB_STEP_SUMMARY
            echo "| Search Products | 3 tests | Tìm kiếm sản phẩm |" >> $GITHUB_STEP_SUMMARY
            echo "| Filter Products | 6 tests | Lọc sản phẩm |" >> $GITHUB_STEP_SUMMARY
            echo "| Create Product | 9 tests | Thêm sản phẩm (Admin/Employee) |" >> $GITHUB_STEP_SUMMARY
            echo "| Update Product | 4 tests | Cập nhật sản phẩm (Admin/Employee) |" >> $GITHUB_STEP_SUMMARY
            echo "| Delete Product | 4 tests | Xóa sản phẩm (Admin/Employee) |" >> $GITHUB_STEP_SUMMARY
            
            if [ "$FAILED_TESTS" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ❌ Failed Tests Details" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              jq -r '.testResults[].assertionResults[] | select(.status == "failed") | "🔴 **" + .ancestorTitles[0] + " > " + .ancestorTitles[1] + "**\n\nTest: " + .title + "\n\nError:\n```\n" + (.failureMessages[0] // "No error message") + "\n```\n"' test-results.json >> $GITHUB_STEP_SUMMARY || echo "⚠️ Could not parse failed test details" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📚 Test Case Mapping" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Chi tiết test cases được định nghĩa trong: **Module3_Product.md**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Test Case IDs:**" >> $GITHUB_STEP_SUMMARY
            echo "- PROD-001 to PROD-006: Get All Products tests (List, Pagination, Sort, Fields)" >> $GITHUB_STEP_SUMMARY
            echo "- PROD-007 to PROD-009: Get Product tests (Detail, Not Found, Invalid ID)" >> $GITHUB_STEP_SUMMARY
            echo "- PROD-010 to PROD-012: Search Products tests (By Name, Description, Empty)" >> $GITHUB_STEP_SUMMARY
            echo "- PROD-013 to PROD-018: Filter Products tests (Category, Brand, Price, Rating, Combined)" >> $GITHUB_STEP_SUMMARY
            echo "- PROD-019 to PROD-027: Create Product tests (Admin, Employee, Validation, Security)" >> $GITHUB_STEP_SUMMARY
            echo "- PROD-028 to PROD-031: Update Product tests (Admin, Employee, Not Found, Security)" >> $GITHUB_STEP_SUMMARY
            echo "- PROD-032 to PROD-035: Delete Product tests (Admin, Not Found, Security)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Function Groups:**" >> $GITHUB_STEP_SUMMARY
            echo "- 📋 **Public Functions**: Get All, Get One, Search, Filter (18 tests)" >> $GITHUB_STEP_SUMMARY
            echo "- 🔐 **Admin/Employee Functions**: Create, Update, Delete (17 tests)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Test results file not found. Check logs above." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module3-product-test-results
          path: |
            Back-end/test-results.json
            Back-end/coverage/

      - name: Comment PR with Test Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResultsPath = './Back-end/test-results.json';
            
            if (fs.existsSync(testResultsPath)) {
              const testResults = JSON.parse(fs.readFileSync(testResultsPath, 'utf8'));
              const totalTests = testResults.numTotalTests;
              const passedTests = testResults.numPassedTests;
              const failedTests = testResults.numFailedTests;
              const passRate = ((passedTests / totalTests) * 100).toFixed(2);
              
              let body = `## 🛍️ Module3 - Product Management Test Results\n\n`;
              body += `| Metric | Value |\n`;
              body += `|--------|-------|\n`;
              body += `| 📝 Total Tests | ${totalTests} |\n`;
              body += `| ✅ Passed | ${passedTests} (${passRate}%) |\n`;
              body += `| ❌ Failed | ${failedTests} |\n\n`;
              
              if (failedTests > 0) {
                body += `### ⚠️ Some tests failed. Please check the details above.\n`;
              } else {
                body += `### ✅ All tests passed! Great job!\n`;
              }
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Fail if tests failed
        working-directory: ./Back-end
        run: |
          if [ -f test-results.json ]; then
            FAILED_TESTS=$(jq '.numFailedTests' test-results.json)
            if [ "$FAILED_TESTS" -gt 0 ]; then
              echo "❌ $FAILED_TESTS test(s) failed"
              exit 1
            else
              echo "✅ All tests passed!"
            fi
          else
            echo "⚠️ Test results file not found"
            exit 1
          fi

